<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFA0" />
    </linearGradient>
    <linearGradient id="violetMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>
    <linearGradient id="dnaStrand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <linearGradient id="dnaStrand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5179E" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(40, 30)">
    <!-- Symbol: Film Strip / DNA Helix Synthesis -->
    <g transform="translate(10, 20)">
      <!-- DNA / Film Wave Strand 1 (Upper Sine Curve) -->
      <path d="M 10,70 C 45,15 85,15 120,70 C 155,125 195,125 230,70" 
            fill="none" 
            stroke="url(#dnaStrand1)" 
            stroke-width="9" 
            stroke-linecap="round" 
            filter="url(#neonGlow)" />

      <!-- DNA / Film Wave Strand 2 (Lower Inverted Sine Curve) -->
      <path d="M 10,70 C 45,125 85,125 120,70 C 155,15 195,15 230,70" 
            fill="none" 
            stroke="url(#dnaStrand2)" 
            stroke-width="9" 
            stroke-linecap="round" 
            filter="url(#neonGlow)" />

      <!-- Base Pair Connectors (Cinematic Sprocket & DNA rungs) -->
      <!-- Rung 1 -->
      <line x1="45" y1="38" x2="45" y2="102" stroke="#9D4EDD" stroke-width="4.5" stroke-linecap="round" opacity="0.85" stroke-dasharray="2 6" />
      <circle cx="45" cy="38" r="5" fill="#00FF87" />
      <circle cx="45" cy="102" r="5" fill="#B5179E" />

      <!-- Node Center Cross -->
      <circle cx="120" cy="70" r="7.5" fill="#F5F7FA" filter="url(#neonGlow)" />

      <!-- Rung 2 -->
      <line x1="195" y1="38" x2="195" y2="102" stroke="#00FF87" stroke-width="4.5" stroke-linecap="round" opacity="0.85" stroke-dasharray="2 6" />
      <circle cx="195" cy="38" r="5" fill="#9D4EDD" />
      <circle cx="195" cy="102" r="5" fill="#00FF87" />

      <!-- Film Sprocket holes / Cinematic accents -->
      <rect x="76" y="65" width="10" height="10" rx="2" fill="#00FF87" opacity="0.75" />
      <rect x="154" y="65" width="10" height="10" rx="2" fill="#B5179E" opacity="0.75" />
    </g>

    <!-- Wordmark Typography -->
    <!-- "Film" in pure white / light silver -->
    <text x="280" y="112" 
          font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="82" 
          letter-spacing="-1.5" 
          fill="#F5F7FA">Film</text>

    <!-- "DNA" in Neon Green with subtle glow and gradient -->
    <text x="445" y="112" 
          font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="82" 
          letter-spacing="0.5" 
          fill="url(#neonGreenGrad)" 
          filter="url(#neonGlow)">DNA</text>

    <!-- Sub-tagline / Categorization badge -->
    <g transform="translate(285, 134)">
      <!-- Mini Neon Green dot indicator -->
      <circle cx="6" cy="-2" r="3.5" fill="#00FF87" />
      <text x="18" y="2" 
            font-family="'JetBrains Mono', monospace" 
            font-size="13" 
            font-weight="500" 
            letter-spacing="3.5" 
            fill="#9D4EDD" 
            text-transform="uppercase">CINEMATIC INTELLIGENCE</text>
    </g>
  </g>
</svg>