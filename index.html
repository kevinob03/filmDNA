<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090C" />
    <script>
      try {
        const storedAccessibility = JSON.parse(localStorage.getItem('filmdna_accessibility_preferences_v1'))
        const validContrast = ['normal', 'high'].includes(storedAccessibility?.contrast)
        const validTextSize = ['100', '110', '125'].includes(storedAccessibility?.textSize)
        document.documentElement.dataset.contrast = validContrast ? storedAccessibility.contrast : 'normal'
        document.documentElement.dataset.textSize = validTextSize ? storedAccessibility.textSize : '100'
      } catch {
        document.documentElement.dataset.contrast = 'normal'
        document.documentElement.dataset.textSize = '100'
      }
    </script>
    <meta
      name="description"
      content="FilmDNA: descubre cine según la experiencia que quieres vivir."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FilmDNA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
