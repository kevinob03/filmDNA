<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" style="background: #08090C;">
  <defs>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#10E57A" />
    </linearGradient>
    <linearGradient id="violetMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(30, 25)">
    <!-- Isotype Symbol: Dual Helix Wave & Film Rungs -->
    <g transform="translate(0, 15)">
      <!-- Green Wave -->
      <path d="M 10,60 C 40,15 75,15 105,60 C 135,105 170,105 200,60" 
            fill="none" 
            stroke="url(#neonGreen)" 
            stroke-width="8" 
            stroke-linecap="round" 
            filter="url(#glow)" />

      <!-- Violet Wave -->
      <path d="M 10,60 C 40,105 75,105 105,60 C 135,15 170,15 200,60" 
            fill="none" 
            stroke="url(#violetMagenta)" 
            stroke-width="8" 
            stroke-linecap="round" 
            filter="url(#glow)" />

      <!-- Intersecting base pair lines and nodes -->
      <line x1="40" y1="35" x2="40" y2="85" stroke="#9D4EDD" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <circle cx="40" cy="35" r="4.5" fill="#00FF87" />
      <circle cx="40" cy="85" r="4.5" fill="#B5179E" />

      <circle cx="105" cy="60" r="6" fill="#F5F7FA" filter="url(#glow)" />

      <line x1="170" y1="35" x2="170" y2="85" stroke="#00FF87" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <circle cx="170" cy="35" r="4.5" fill="#9D4EDD" />
      <circle cx="170" cy="85" r="4.5" fill="#00FF87" />
    </g>

    <!-- Wordmark -->
    <text x="240" y="98" 
          font-family="'Space Grotesk', system-ui, sans-serif" 
          font-weight="700" 
          font-size="76" 
          letter-spacing="-1.5" 
          fill="#F5F7FA">Film</text>

    <text x="390" y="98" 
          font-family="'Space Grotesk', system-ui, sans-serif" 
          font-weight="800" 
          font-size="76" 
          letter-spacing="0.5" 
          fill="url(#neonGreen)" 
          filter="url(#glow)">DNA</text>
  </g>
</svg>